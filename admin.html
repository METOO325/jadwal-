<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تعديل الجداول</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --bg:#EEF2F1; --surface:#FFFFFF; --ink:#1C2B33; --muted:#5E6F77; --line:#D3DCDA;
  --brand:#155E57; --brand-soft:#DCEBE8;
  --cancel:#B03A2E; --cancel-bg:#F8E1DE; --change:#A86A00; --change-bg:#FBEFD6; --extra:#227A4B; --extra-bg:#E1F2E8;
  --r-sm:6px; --r:10px;
  font-family:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.hidden{display:none!important}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
header.top{background:var(--brand);color:#fff}
header.top .wrap{display:flex;align-items:center;gap:14px;min-height:60px;flex-wrap:wrap}
header.top h1{font-size:1.15rem;margin:0}
header.top a{color:#fff}
header.top .who{margin-inline-start:auto;display:flex;gap:10px;align-items:center;font-size:.92rem}
.btn{border:1px solid var(--brand);background:var(--brand);color:#fff;border-radius:var(--r-sm);padding:7px 14px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--brand)}
.btn.light{background:transparent;border-color:rgba(255,255,255,.5);color:#fff;padding:4px 12px}
.btn.danger{background:transparent;border-color:var(--cancel);color:var(--cancel)}
.btn.sm{padding:3px 10px;font-size:.85rem}
.btn:disabled{opacity:.5;cursor:default}
input,select,textarea{border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 10px;background:#fff;min-width:0}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.88rem;color:var(--muted)}
label.chk{display:flex;gap:8px;align-items:center;font-weight:600;color:var(--cancel)}
main{padding:18px 0 48px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.bar select#sched{flex:1 1 320px;font-size:1.05rem;padding:10px 12px;border:2px solid var(--brand)}
.weeknav{display:flex;gap:6px;align-items:center;margin:14px 0}
.weeknav b{min-width:200px;text-align:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:14px}
.panel h3{margin:0 0 8px;font-size:1rem}
.notice-row{display:flex;gap:10px;align-items:flex-start}
.notice-row textarea{flex:1;min-height:44px;resize:vertical}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.dcol{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column}
.dcol header{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.dcol header b{font-size:1rem}
.dcol header small{color:var(--muted)}
.dcol.today{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft)}
.items{display:flex;flex-direction:column}
.it{padding:9px 12px;border-bottom:1px solid var(--line);border-inline-start:4px solid transparent}
.it:last-child{border-bottom:0}
.it .t{font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.it .s{font-weight:600;font-size:.94rem;line-height:1.35}
.it .m{font-size:.84rem;color:var(--muted)}
.it .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.it.cancelled{border-inline-start-color:var(--cancel);background:var(--cancel-bg)}
.it.cancelled .s{text-decoration:line-through}
.it.changed{border-inline-start-color:var(--change);background:var(--change-bg)}
.it.extra{border-inline-start-color:var(--extra);background:var(--extra-bg)}
.tag{display:inline-block;border-radius:5px;padding:0 6px;font-size:.74rem;font-weight:600;margin-inline-end:4px}
.tag.lang{background:var(--bg)} .tag.cancel{background:var(--cancel);color:#fff} .tag.change{background:var(--change);color:#fff} .tag.extra{background:var(--extra);color:#fff}
.was{text-decoration:line-through;opacity:.7}
.dcol footer{padding:8px 12px;border-top:1px dashed var(--line)}
.empty{color:var(--muted);padding:14px 12px;font-size:.9rem}

.login{min-height:100vh;display:grid;place-items:center;padding:16px}
.login form{background:var(--surface);border:1px solid var(--line);border-top:6px solid var(--brand);border-radius:var(--r);padding:28px;width:100%;max-width:380px;display:flex;flex-direction:column;gap:14px}
.login h1{margin:0;font-size:1.3rem}
.err{color:var(--cancel);font-size:.9rem;min-height:1.2em}

dialog{border:0;border-radius:var(--r);padding:0;width:min(560px,calc(100vw - 24px));color:var(--ink)}
dialog::backdrop{background:rgba(20,35,40,.45)}
.dh{display:flex;justify-content:space-between;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
.dh h2{margin:0;font-size:1.1rem}
.dh .sub{color:var(--muted);font-size:.86rem}
.db{padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.x{background:none;border:0;font-size:1.4rem;cursor:pointer;color:var(--muted)}
.acts-end{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.hint{font-size:.84rem;color:var(--muted);margin:0}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:var(--r-sm);z-index:50}

/* QR */
#qrBox{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
#qrBox .qr{padding:10px;background:#fff}
#printArea{display:none}
.qcard{border:2px solid #155E57;border-radius:14px;padding:18px;text-align:center;break-inside:avoid;page-break-inside:avoid}
.qcard h2{margin:0;font-size:20px}
.qcard p{margin:4px 0 10px;font-size:15px}
.qcard .qr{display:inline-block}
.qcard small{display:block;margin-top:8px;font-size:12px;color:#444}
@media print{
  body > *:not(#printArea){display:none!important}
  #printArea{display:grid!important;grid-template-columns:1fr 1fr;gap:14mm;padding:6mm}
  #printArea.one{grid-template-columns:1fr;max-width:120mm;margin:20mm auto}
  @page{size:A4;margin:10mm}
}
@media (max-width:560px){.g2{grid-template-columns:1fr}}
</style>
</head>
<body>

<section id="loginView" class="login hidden">
  <form id="loginForm">
    <h1>تعديل الجداول</h1>
    <p class="hint">ادخل بالحساب اللي اتعمل لك في Supabase.</p>
    <label class="f">البريد الإلكتروني<input type="email" id="loginEmail" required autocomplete="username"></label>
    <label class="f">كلمة المرور<input type="password" id="loginPass" required autocomplete="current-password"></label>
    <div class="err" id="loginErr"></div>
    <button class="btn" type="submit">تسجيل الدخول</button>
  </form>
</section>

<div id="appView" class="hidden">
  <header class="top"><div class="wrap">
    <h1>تعديل الجداول</h1>
    <div class="who"><span id="meName"></span><button class="btn light" id="logoutBtn">خروج</button></div>
  </div></header>
  <main class="wrap">
    <div class="bar">
      <select id="sched" aria-label="اختار الجدول"></select>
      <button class="btn ghost" id="openPublic">صفحة الطلبة</button>
      <button class="btn ghost" id="qrBtn">QR الجدول ده</button>
      <button class="btn ghost" id="qrAllBtn">طباعة QR الفرق</button>
      <button class="btn ghost" id="qrRoomsBtn">طباعة QR المدرجات</button>
      <button class="btn" id="addItemBtn">+ محاضرة ثابتة</button>
    </div>
    <div class="weeknav">
      <button class="btn ghost sm" id="prevWeek">الأسبوع اللي فات</button>
      <b id="weekLabel"></b>
      <button class="btn ghost sm" id="nextWeek">الأسبوع الجاي</button>
      <button class="btn ghost sm" id="thisWeek">الأسبوع ده</button>
    </div>
    <div class="panel">
      <h3>تنبيه يظهر فوق الجدول للطلبة</h3>
      <div class="notice-row">
        <textarea id="notice" placeholder="مثلاً: محاضرات يوم الخميس هتبدأ الساعة 10 بدل 9"></textarea>
        <button class="btn" id="saveNotice">حفظ</button>
      </div>
    </div>
    <div class="grid" id="grid"></div>
  </main>
</div>

<!-- تعديل ليوم واحد -->
<dialog id="chDlg"><form id="chForm">
  <div class="dh"><div><h2 id="chTitle">تعديل لليوم ده بس</h2><div class="sub" id="chSub"></div></div><button type="button" class="x" data-close>×</button></div>
  <div class="db">
    <label class="chk" id="cancelWrap"><input type="checkbox" id="chCancel"> المحاضرة ملغاة اليوم ده</label>
    <label class="f hidden" id="chSubjWrap">اسم المادة<input type="text" id="chSubj"></label>
    <div class="g2">
      <label class="f">المحاضر (بديل)<input type="text" id="chLect" placeholder="سيبه فاضي لو مفيش تغيير"></label>
      <label class="f">القاعة<input type="text" id="chRoom" placeholder="سيبه فاضي لو مفيش تغيير"></label>
      <label class="f">من<input type="time" id="chStart"></label>
      <label class="f">إلى<input type="time" id="chEnd"></label>
    </div>
    <label class="f">ملاحظة تظهر للطلبة<input type="text" id="chNote" placeholder="مثلاً: الدكتور في مؤتمر — المحاضرة هتتعوض"></label>
    <p class="hint" id="chHint">التعديل ده لليوم ده بس. الأسبوع الجاي الجدول بيرجع طبيعي.</p>
    <div class="err" id="chErr"></div>
    <div class="acts-end">
      <button type="button" class="btn danger hidden" id="chDelete">رجّعها زي ما كانت</button>
      <button class="btn" type="submit">حفظ</button>
    </div>
  </div>
</form></dialog>

<!-- تعديل دائم -->
<dialog id="itDlg"><form id="itForm">
  <div class="dh"><div><h2 id="itTitle">محاضرة ثابتة</h2><div class="sub">بتتكرر كل أسبوع</div></div><button type="button" class="x" data-close>×</button></div>
  <div class="db">
    <label class="f">اسم المادة<input type="text" id="itSubj" required></label>
    <div class="g2">
      <label class="f">اليوم<select id="itDay"></select></label>
      <label class="f">اللغة (للغات بس)<select id="itLang"><option value="">—</option><option>ألماني</option><option>فرنسي</option><option>إيطالي</option><option>ياباني</option><option>كوري</option></select></label>
      <label class="f">من<input type="time" id="itStart" required></label>
      <label class="f">إلى<input type="time" id="itEnd" required></label>
      <label class="f">المحاضر<input type="text" id="itLect"></label>
      <label class="f">القاعة<input type="text" id="itRoom"></label>
    </div>
    <div class="err" id="itErr"></div>
    <div class="acts-end">
      <button type="button" class="btn danger hidden" id="itDelete">حذف المحاضرة من الجدول</button>
      <button class="btn" type="submit">حفظ</button>
    </div>
  </div>
</form></dialog>

<!-- QR -->
<dialog id="qrDlg">
  <div class="dh"><h2>QR الجدول</h2><button type="button" class="x" data-close>×</button></div>
  <div class="db"><div id="qrBox"></div>
    <div class="acts-end"><button class="btn ghost" id="copyLink">نسخ اللينك</button><button class="btn" id="printOne">طباعة</button></div></div>
</dialog>

<div id="printArea"></div>

<script>
/* حط هنا رابط ومفتاح مشروع Supabase الجديد بتاع الجداول */
const SUPABASE_URL      = 'https://yojdekykcumpslarkfaf.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_LsYAEhQ7GSQ8iODLKNmWKQ_agv5Vnv1';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DAY_NAMES = ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const WEEK_ORDER = [6,0,1,2,3,4,5];
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const addDays = (d,n) => { const x=new Date(d); x.setDate(x.getDate()+n); return x; };
const t5 = t => t ? String(t).slice(0,5) : '';
const mins = t => { const [h,m]=String(t).split(':').map(Number); return h*60+m; };
const clock = t => { if(!t) return ''; const [h,m]=String(t).split(':').map(Number); return (h%12||12)+(m?':'+String(m).padStart(2,'0'):'')+(h<12?' ص':' م'); };
const fmt = new Intl.DateTimeFormat('ar-EG-u-nu-latn',{day:'numeric',month:'long'});
const roomUrl = r => new URL('./?room='+encodeURIComponent(r), location.href).href;
const normRoom = v => String(v||'').replace(/\s+/g,'').replace(/ة/g,'ه').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي');
const publicUrl = slug => new URL('./?s='+encodeURIComponent(slug), location.href).href;
function toast(m){ const t=document.createElement('div'); t.className='toast'; t.textContent=m; document.body.append(t); setTimeout(()=>t.remove(),2600); }
function weekStartFor(d){ const dow=d.getDay(); let ws=addDays(d,-((dow+1)%7)); if(dow===5) ws=addDays(ws,7); ws.setHours(0,0,0,0); return ws; }

const state = { profile:null, scheds:[], sched:null, items:[], changes:[], weekStart:weekStartFor(new Date()), editCh:null, editIt:null };

/* ---------- الدخول ---------- */
async function boot(){ const { data:{ session } } = await sb.auth.getSession(); session ? enter(session.user) : showLogin(); }
function showLogin(){ $('#appView').classList.add('hidden'); $('#loginView').classList.remove('hidden'); }
$('#loginForm').addEventListener('submit', async e=>{
  e.preventDefault(); $('#loginErr').textContent='';
  const { data, error } = await sb.auth.signInWithPassword({ email:$('#loginEmail').value.trim(), password:$('#loginPass').value });
  if(error) return $('#loginErr').textContent='البريد أو كلمة المرور غلط.';
  enter(data.user);
});
$('#logoutBtn').addEventListener('click', async ()=>{ await sb.auth.signOut(); location.reload(); });
async function enter(user){
  state.profile = user; const md = user.user_metadata || {}; $('#meName').textContent = md.display_name || md.full_name || user.email;
  $('#loginView').classList.add('hidden'); $('#appView').classList.remove('hidden');
  $('#itDay').innerHTML = WEEK_ORDER.map(d=>`<option value="${d}">${DAY_NAMES[d]}</option>`).join('');
  const { data } = await sb.from('schedules').select('*').order('sort');
  state.scheds = data||[];
  const groups = {}; state.scheds.forEach(s=>(groups[s.grp||'أخرى'] ||= []).push(s));
  $('#sched').innerHTML = Object.entries(groups).map(([g,l])=>`<optgroup label="${esc(g)}">${l.map(s=>`<option value="${s.id}">${esc(s.title)}${s.track?' — '+esc(s.track):''}</option>`).join('')}</optgroup>`).join('');
  const last = (()=>{ try{ return localStorage.getItem('jadwal-admin-last'); }catch{ return null; } })();
  if(last && state.scheds.some(s=>String(s.id)===last)) $('#sched').value = last;
  await loadSched();
}

/* ---------- تحميل ---------- */
async function loadSched(){
  const id = +$('#sched').value; try{ localStorage.setItem('jadwal-admin-last', id); }catch{}
  state.sched = state.scheds.find(s=>s.id===id);
  const [{data:s},{data:items}] = await Promise.all([
    sb.from('schedules').select('*').eq('id',id).single(),
    sb.from('schedule_items').select('*').eq('schedule_id',id).order('start_time')]);
  state.sched = s; state.items = items||[];
  $('#notice').value = s.notice || '';
  await loadChanges(); render();
}
async function loadChanges(){
  const { data } = await sb.from('schedule_changes').select('*').eq('schedule_id', state.sched.id)
    .gte('on_date', iso(state.weekStart)).lte('on_date', iso(addDays(state.weekStart,6)));
  state.changes = data||[];
}
async function touch(){ await sb.from('schedules').update({ updated_at:new Date().toISOString() }).eq('id', state.sched.id); }

/* ---------- العرض ---------- */
function render(){
  const ws = state.weekStart, we = addDays(ws,6);
  $('#weekLabel').textContent = `${fmt.format(ws)} — ${fmt.format(we)}`;
  const todayIso = iso(new Date());
  const days = new Set([0,1,2,3,4, ...state.items.map(i=>i.day)]);
  state.changes.forEach(c=>{ if(!c.item_id) days.add(new Date(c.on_date+'T12:00').getDay()); });
  $('#grid').innerHTML = WEEK_ORDER.filter(d=>days.has(d)).map(d=>{
    const date = addDays(ws, WEEK_ORDER.indexOf(d)), dIso = iso(date);
    const ch = state.changes.filter(c=>c.on_date===dIso);
    const byItem = new Map(ch.filter(c=>c.item_id).map(c=>[c.item_id,c]));
    const rows = state.items.filter(i=>i.day===d).map(i=>({ ...i, change:byItem.get(i.id) }))
      .concat(ch.filter(c=>!c.item_id).map(c=>({ id:null, extra:true, change:c, subject:c.subject, lecturer:c.lecturer, room:c.room, start_time:c.start_time, end_time:c.end_time })))
      .sort((a,b)=>mins((a.change?.start_time)||a.start_time)-mins((b.change?.start_time)||b.start_time));
    return `<section class="dcol ${dIso===todayIso?'today':''}">
      <header><b>${DAY_NAMES[d]}</b><small>${fmt.format(date)}</small></header>
      <div class="items">${rows.length? rows.map(r=>{
        const c = r.change, kind = r.extra?'extra':c?(c.cancelled?'cancelled':'changed'):'';
        const st = c?.start_time||r.start_time, en = c?.end_time||r.end_time;
        const lect = c && !r.extra && c.lecturer ? `${esc(c.lecturer)} <span class="was">${esc(r.lecturer)}</span>` : esc(r.lecturer||'');
        const room = c && !r.extra && c.room ? `${esc(c.room)} <span class="was">${esc(r.room)}</span>` : esc(r.room||'');
        return `<div class="it ${kind}">
          <div class="t">${clock(st)} – ${clock(en)}
            ${kind==='cancelled'?'<span class="tag cancel">ملغاة</span>':''}${kind==='changed'?'<span class="tag change">تعديل</span>':''}${kind==='extra'?'<span class="tag extra">تعويضية</span>':''}${r.lang?`<span class="tag lang">${esc(r.lang)}</span>`:''}</div>
          <div class="s">${esc(r.subject)}</div>
          <div class="m">${lect}${room?' · '+room:''}${c?.note?`<br>📝 ${esc(c.note)}`:''}</div>
          <div class="acts">
            ${r.extra
              ? `<button class="btn ghost sm" data-act="extra" data-ch="${c.id}" data-date="${dIso}">تعديل</button>`
              : `<button class="btn ${c?'ghost':''} sm" data-act="day" data-item="${r.id}" data-date="${dIso}">${c?'تعديل اليوم ده':'إلغاء / تغيير اليوم ده'}</button>
                 <button class="btn ghost sm" data-act="perm" data-item="${r.id}">تعديل دائم</button>`}
          </div></div>`; }).join('') : '<div class="empty">مفيش محاضرات.</div>'}</div>
      <footer><button class="btn ghost sm" data-act="add-extra" data-date="${dIso}">+ محاضرة تعويضية اليوم ده</button></footer>
    </section>`;
  }).join('');
}

$('#grid').addEventListener('click', e=>{
  const b = e.target.closest('button[data-act]'); if(!b) return;
  const act = b.dataset.act;
  if(act==='day') openChange({ item: state.items.find(i=>i.id===+b.dataset.item), date:b.dataset.date });
  if(act==='extra') openChange({ change: state.changes.find(c=>c.id===+b.dataset.ch), date:b.dataset.date });
  if(act==='add-extra') openChange({ date:b.dataset.date, newExtra:true });
  if(act==='perm') openItem(state.items.find(i=>i.id===+b.dataset.item));
});
$('#sched').addEventListener('change', loadSched);
$('#prevWeek').addEventListener('click', async ()=>{ state.weekStart=addDays(state.weekStart,-7); await loadChanges(); render(); });
$('#nextWeek').addEventListener('click', async ()=>{ state.weekStart=addDays(state.weekStart,7); await loadChanges(); render(); });
$('#thisWeek').addEventListener('click', async ()=>{ state.weekStart=weekStartFor(new Date()); await loadChanges(); render(); });
document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>b.closest('dialog').close()));

$('#saveNotice').addEventListener('click', async ()=>{
  const { error } = await sb.from('schedules').update({ notice:$('#notice').value.trim()||null, updated_at:new Date().toISOString() }).eq('id', state.sched.id);
  toast(error ? 'ماتحفظش: '+error.message : 'اتحفظ التنبيه');
});
$('#openPublic').addEventListener('click', ()=>window.open(publicUrl(state.sched.slug),'_blank'));

/* ---------- تعديل ليوم واحد / محاضرة تعويضية ---------- */
function openChange({ item, change, date, newExtra }){
  const isExtra = newExtra || (change && !change.item_id);
  const c = change || (item && state.changes.find(x=>x.item_id===item.id && x.on_date===date)) || null;
  state.editCh = { item, change:c, date, isExtra };
  const d = new Date(date+'T12:00');
  $('#chTitle').textContent = isExtra ? 'محاضرة تعويضية' : 'تعديل لليوم ده بس';
  $('#chSub').textContent = `${DAY_NAMES[d.getDay()]} ${fmt.format(d)}` + (item ? ` — ${item.subject} (${clock(item.start_time)} – ${clock(item.end_time)})` : '');
  $('#cancelWrap').classList.toggle('hidden', isExtra);
  $('#chSubjWrap').classList.toggle('hidden', !isExtra);
  $('#chSubj').required = isExtra; $('#chStart').required = isExtra; $('#chEnd').required = isExtra;
  $('#chHint').textContent = isExtra ? 'المحاضرة دي هتظهر في اليوم ده بس بعلامة "محاضرة تعويضية".' : 'التعديل ده لليوم ده بس. الأسبوع الجاي الجدول بيرجع طبيعي.';
  $('#chCancel').checked = !!c?.cancelled;
  $('#chSubj').value = c?.subject || '';
  $('#chLect').value = c?.lecturer || ''; $('#chRoom').value = c?.room || '';
  $('#chStart').value = t5(c?.start_time); $('#chEnd').value = t5(c?.end_time);
  $('#chNote').value = c?.note || ''; $('#chErr').textContent='';
  $('#chLect').placeholder = item?.lecturer ? `الحالي: ${item.lecturer}` : ''; $('#chRoom').placeholder = item?.room ? `الحالي: ${item.room}` : '';
  $('#chDelete').classList.toggle('hidden', !c);
  $('#chDelete').textContent = isExtra ? 'حذف المحاضرة التعويضية' : 'رجّعها زي ما كانت';
  $('#chDlg').showModal();
}
$('#chForm').addEventListener('submit', async e=>{
  e.preventDefault();
  const { item, change, date, isExtra } = state.editCh;
  const row = { schedule_id:state.sched.id, item_id:item?.id ?? null, on_date:date,
    cancelled: !isExtra && $('#chCancel').checked,
    subject: isExtra ? $('#chSubj').value.trim() : null,
    lecturer:$('#chLect').value.trim()||null, room:$('#chRoom').value.trim()||null,
    start_time:$('#chStart').value||null, end_time:$('#chEnd').value||null, note:$('#chNote').value.trim()||null };
  if(!isExtra && !row.cancelled && !row.lecturer && !row.room && !row.start_time && !row.end_time && !row.note)
    return $('#chErr').textContent='اختار إلغاء أو اكتب التغيير (محاضر، قاعة، ميعاد أو ملاحظة).';
  if(row.start_time && row.end_time && row.end_time<=row.start_time) return $('#chErr').textContent='ميعاد النهاية لازم يكون بعد البداية.';
  const { error } = change
    ? await sb.from('schedule_changes').update(row).eq('id', change.id)
    : await sb.from('schedule_changes').insert(row);
  if(error) return $('#chErr').textContent = error.message;
  await touch(); $('#chDlg').close(); toast('اتحفظ — والطلبة هيشوفوه على طول'); await loadChanges(); render();
});
$('#chDelete').addEventListener('click', async ()=>{
  const c = state.editCh.change; if(!c) return;
  if(!confirm(state.editCh.isExtra ? 'تحذف المحاضرة التعويضية؟' : 'ترجّع المحاضرة لميعادها العادي؟')) return;
  const { error } = await sb.from('schedule_changes').delete().eq('id', c.id);
  if(error) return $('#chErr').textContent=error.message;
  await touch(); $('#chDlg').close(); toast('اترجعت'); await loadChanges(); render();
});

/* ---------- تعديل دائم ---------- */
function openItem(it){
  state.editIt = it||null;
  $('#itTitle').textContent = it ? 'تعديل دائم للمحاضرة' : 'محاضرة ثابتة جديدة';
  $('#itSubj').value = it?.subject||''; $('#itDay').value = it?.day ?? 0;
  $('#itStart').value = t5(it?.start_time); $('#itEnd').value = t5(it?.end_time);
  $('#itLect').value = it?.lecturer||''; $('#itRoom').value = it?.room||''; $('#itLang').value = it?.lang||'';
  $('#itErr').textContent=''; $('#itDelete').classList.toggle('hidden', !it);
  $('#itDlg').showModal();
}
$('#addItemBtn').addEventListener('click', ()=>openItem());
$('#itForm').addEventListener('submit', async e=>{
  e.preventDefault();
  const row = { schedule_id:state.sched.id, subject:$('#itSubj').value.trim(), day:+$('#itDay').value,
    start_time:$('#itStart').value, end_time:$('#itEnd').value, lecturer:$('#itLect').value.trim()||null,
    room:$('#itRoom').value.trim()||null, lang:$('#itLang').value||null };
  if(row.end_time<=row.start_time) return $('#itErr').textContent='ميعاد النهاية لازم يكون بعد البداية.';
  const { error } = state.editIt
    ? await sb.from('schedule_items').update(row).eq('id', state.editIt.id)
    : await sb.from('schedule_items').insert(row);
  if(error) return $('#itErr').textContent=error.message;
  await touch(); $('#itDlg').close(); toast('اتحفظ في الجدول الأساسي'); await loadSched();
});
$('#itDelete').addEventListener('click', async ()=>{
  if(!confirm('تحذف المحاضرة دي من الجدول كل أسبوع؟')) return;
  const { error } = await sb.from('schedule_items').delete().eq('id', state.editIt.id);
  if(error) return $('#itErr').textContent=error.message;
  await touch(); $('#itDlg').close(); toast('اتحذفت'); await loadSched();
});

/* ---------- QR ---------- */
function qrInto(el, text, size){ el.innerHTML=''; new QRCode(el, { text, width:size, height:size, correctLevel:QRCode.CorrectLevel.M }); }
$('#qrBtn').addEventListener('click', ()=>{
  const s = state.sched, url = publicUrl(s.slug);
  $('#qrBox').innerHTML = `<div class="qr" id="qrOne"></div><b>${esc(s.title)}${s.track?' — '+esc(s.track):''}</b><small class="hint" style="direction:ltr">${esc(url)}</small>`;
  qrInto($('#qrOne'), url, 220); $('#qrDlg').showModal();
});
$('#copyLink').addEventListener('click', async ()=>{ try{ await navigator.clipboard.writeText(publicUrl(state.sched.slug)); toast('اتنسخ اللينك'); }catch{ toast(publicUrl(state.sched.slug)); } });
function printCards(list, one, kind){
  const pa = $('#printArea'); pa.className = one?'one':'';
  const isRoom = kind==='room';
  pa.innerHTML = list.map((s,i)=>`<div class="qcard"><h2>${isRoom?'جدول المكان ده':'جدول المحاضرات'}</h2><p><b style="font-size:${isRoom?'26px':'inherit'}">${esc(isRoom?s:s.title)}</b>${!isRoom&&s.track?'<br>'+esc(s.track):''}</p><div class="qr" id="pq${i}"></div><small>صوّر الكود بكاميرا الموبايل عشان تشوف ${isRoom?'المحاضرات اللي هنا النهارده':'جدول النهارده'} وأي إلغاء أو تعديل</small></div>`).join('');
  list.forEach((s,i)=>qrInto($('#pq'+i), isRoom ? roomUrl(s) : publicUrl(s.slug), one?300:190));
  setTimeout(()=>window.print(), 400);
}
$('#printOne').addEventListener('click', ()=>printCards([state.sched], true));
$('#qrAllBtn').addEventListener('click', ()=>printCards(state.scheds, false));
$('#qrRoomsBtn').addEventListener('click', async ()=>{
  const { data } = await sb.from('schedule_items').select('room');
  const m = new Map(); (data||[]).forEach(r=>{ if(r.room && !m.has(normRoom(r.room))) m.set(normRoom(r.room), r.room); });
  const rooms = [...m.values()].sort((a,b)=>a.localeCompare(b,'ar',{numeric:true}));
  if(!rooms.length) return toast('مفيش قاعات متسجلة في الجداول');
  printCards(rooms, false, 'room');
});

boot();
</script>
</body>
</html>
